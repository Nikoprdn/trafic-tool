<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Monaco — Utility Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Share+Tech+Mono&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --red:    #E4032E;
  --dark:   #1C1F2A;
  --panel:  #13161E;
  --card:   #1A1D28;
  --border: #252933;
  --text:   #E8EAF0;
  --muted:  #636878;
  --yellow: #F5C518;
  --orange: #FF6B35;
  --green:  #27AE60;
  --blue-row: #0057A8;
  --blue-row-alt: #00408A;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--red);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  height: 60px;
  flex-shrink: 0;
  box-shadow: 0 3px 16px rgba(0,0,0,0.6);
  z-index: 10;
}
.header-left { display:flex; align-items:center; gap:18px; }
.header-logo { height:36px; width:auto; }
.header-div  { width:1px; height:28px; background:rgba(255,255,255,0.3); }
.header-title {
  font-family:'Barlow Condensed',sans-serif;
  font-size:20px; font-weight:700;
  letter-spacing:0.18em; color:#fff;
  text-transform:uppercase;
}
.clock {
  font-family:'Share Tech Mono',monospace;
  font-size:26px; color:#fff; letter-spacing:0.05em;
}

/* ── LAYOUT ── */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 420px;
  grid-template-rows: 1fr 1fr;
  gap: 0;
  overflow: hidden;
  min-height: 0;
}

/* ── PANELS ── */
.panel {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  min-height: 0;
}

.panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  height: 40px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.panel-icon  { font-size:15px; }
.panel-title {
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px; font-weight:700;
  letter-spacing:0.14em; text-transform:uppercase; color:var(--text);
}
.live-dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--green);
  animation: blink 2s ease-in-out infinite;
  margin-left:4px;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

.refresh-btn {
  margin-left:auto; background:transparent;
  border:1px solid var(--border); color:var(--muted);
  border-radius:4px; padding:3px 10px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px; font-weight:600; letter-spacing:0.08em;
  text-transform:uppercase; cursor:pointer; transition:all 0.2s;
}
.refresh-btn:hover { border-color:var(--red); color:var(--red); }

/* ── SNCF PANEL spans full left column ── */
.panel-sncf {
  grid-column: 1;
  grid-row: 1 / 3;
  border-right: 1px solid var(--border);
}

/* ── SNCF STATIONS GRID ── */
.sncf-body {
  flex: 1; overflow-y:auto; overflow-x:hidden;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 0;
  min-height: 0;
}
.sncf-body::-webkit-scrollbar { width:4px; }
.sncf-body::-webkit-scrollbar-track { background:transparent; }
.sncf-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.station-col {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.station-col:nth-child(even) { border-right:none; }
.station-col:nth-child(3),
.station-col:nth-child(4) { border-bottom:none; }

.station-name {
  background: var(--blue-row-alt);
  padding: 7px 14px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:14px; font-weight:800;
  letter-spacing:0.12em; text-transform:uppercase;
  display:flex; align-items:center; justify-content:space-between;
  flex-shrink: 0;
  border-bottom: 2px solid rgba(255,255,255,0.1);
}
.station-name .dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--green);
  animation:blink 2s ease-in-out infinite;
}

/* ── DEPARTURE BOARD (gare style) ── */
.departure-board {
  flex:1; overflow-y:auto; overflow-x:hidden;
  display:flex; flex-direction:column;
  background: #003580;
}
.departure-board::-webkit-scrollbar { width:3px; }
.departure-board::-webkit-scrollbar-track { background:transparent; }
.departure-board::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.2); }

.dep-row {
  display: grid;
  grid-template-columns: 5px 108px 54px 72px 1fr 44px;
  align-items: stretch;
  min-height: 48px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  transition: background 0.12s;
  background: var(--blue-row);
}
.dep-row:nth-child(even) { background: var(--blue-row-alt); }
.dep-row:hover { background: rgba(255,255,255,0.07); }

/* left color bar */
.dep-bar {
  width:5px; align-self:stretch;
}
.dep-bar.delayed  { background: var(--yellow); }
.dep-bar.cancelled{ background: var(--red); }
.dep-bar.modified { background: var(--orange); }
.dep-bar.ok       { background: var(--green); }

/* status + time column */
.dep-time-col {
  display:flex; flex-direction:column;
  justify-content:center; padding:5px 8px 5px 10px;
  gap:1px;
}
.dep-status-lbl {
  font-family:'Barlow Condensed',sans-serif;
  font-size:9.5px; font-weight:700;
  letter-spacing:0.1em; text-transform:uppercase;
}
.dep-status-lbl.delayed  { color:var(--yellow); }
.dep-status-lbl.cancelled{ color:#ff6b6b; }
.dep-status-lbl.modified { color:var(--orange); }
.dep-status-lbl.ok       { color:var(--green); }

.dep-time {
  font-family:'Share Tech Mono',monospace;
  font-size:20px; font-weight:700;
  color:var(--yellow); line-height:1;
}
.dep-time.cancelled {
  color:var(--muted);
  text-decoration: line-through;
}

/* warning icon */
.dep-warn {
  display:flex; align-items:center; justify-content:center;
  font-size:16px;
}

/* delay badge */
.dep-delay-col {
  display:flex; align-items:center; justify-content:center;
  padding:0 4px;
}
.dep-badge {
  display:inline-flex; align-items:center; justify-content:center;
  font-family:'Share Tech Mono',monospace;
  font-size:10.5px; font-weight:700;
  padding:3px 6px; border-radius:3px;
  white-space:nowrap; width:100%; text-align:center;
}
.dep-badge.delayed-big   { background:var(--red); color:#fff; }
.dep-badge.delayed-minor { background:#c47a00; color:#fff; }
.dep-badge.ok            { background:var(--green); color:#000; }
.dep-badge.modified      { background:var(--orange); color:#fff; }
.dep-badge.cancelled     { background:#4a0000; color:#ff6b6b; border:1px solid #ff6b6b; }

/* destination */
.dep-dest {
  display:flex; flex-direction:column; justify-content:center;
  padding:5px 8px; overflow:hidden;
}
.dep-dest-main {
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  line-height:1.1;
}
.dep-dest-main.striked { text-decoration:line-through; color:var(--muted); }
.dep-dest-sub {
  font-family:'Share Tech Mono',monospace;
  font-size:9.5px; color:rgba(255,255,255,0.45); margin-top:2px;
}

/* voie */
.dep-voie {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-left:1px solid rgba(255,255,255,0.08);
  padding:0 6px;
  background: rgba(0,0,0,0.15);
}
.dep-voie span:first-child { font-size:8px; color:rgba(255,255,255,0.4); font-family:'Barlow Condensed',sans-serif; letter-spacing:0.05em; }
.dep-voie span:last-child  { font-size:17px; font-family:'Barlow Condensed',sans-serif; font-weight:800; line-height:1; }

/* board empty/loading */
.board-msg {
  display:flex; align-items:center; justify-content:center;
  padding:20px 10px; text-align:center;
  font-family:'Share Tech Mono',monospace;
  font-size:12px; color:rgba(255,255,255,0.3);
  flex:1;
}

/* ── DISRUPTIONS ── */
.panel-disruptions {
  grid-column: 2;
  grid-row: 1;
}
.dis-body { flex:1; overflow-y:auto; padding:10px 12px; min-height:0; }
.dis-body::-webkit-scrollbar { width:3px; }
.dis-body::-webkit-scrollbar-track { background:transparent; }
.dis-body::-webkit-scrollbar-thumb { background:var(--border); }

.dis-item {
  background:var(--card); border-radius:6px;
  border-left:3px solid var(--yellow);
  padding:9px 12px; margin-bottom:8px;
  display:flex; flex-direction:column; gap:5px;
}
.dis-item.severe   { border-left-color:var(--red); }
.dis-item.modified { border-left-color:var(--orange); }

.dis-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.dis-train {
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px; font-weight:700; letter-spacing:0.05em;
  line-height:1.2;
}
.dis-badge {
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px; font-weight:700; letter-spacing:0.07em;
  padding:2px 7px; border-radius:20px; text-transform:uppercase;
  white-space:nowrap; flex-shrink:0;
}
.dis-badge.NO_SERVICE        { background:var(--red); color:#fff; }
.dis-badge.SIGNIFICANT_DELAYS{ background:var(--yellow); color:#000; }
.dis-badge.REDUCED_SERVICE   { background:var(--orange); color:#fff; }
.dis-badge.MODIFIED_SERVICE  { background:#6c5ce7; color:#fff; }
.dis-badge.default           { background:var(--border); color:var(--text); }
.dis-text { font-size:11px; color:var(--muted); line-height:1.5; }
.dis-period { font-family:'Share Tech Mono',monospace; font-size:10px; color:#5a5f70; }

.no-dis {
  display:flex; align-items:center; gap:8px; padding:16px 0;
  color:var(--green); font-family:'Barlow Condensed',sans-serif;
  font-size:13px; font-weight:600; letter-spacing:0.08em;
}

/* ── MAPS ── */
.panel-a8   { grid-column:2; grid-row:2; }

.map-wrap {
  flex:1; position:relative; overflow:hidden; min-height:0;
}
.map-wrap iframe {
  position:absolute; inset:0; width:100%; height:100%; border:none;
}
.map-footer {
  flex-shrink:0; padding:6px 12px;
  display:flex; align-items:center; gap:10px;
  border-top:1px solid var(--border);
  background:var(--panel);
}
.map-link {
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px; font-weight:700; letter-spacing:0.08em;
  color:var(--red); text-decoration:none; text-transform:uppercase;
  transition:opacity 0.2s;
}
.map-link:hover { opacity:0.7; }
.map-sub { font-size:10px; color:var(--muted); font-family:'Share Tech Mono',monospace; }

/* ── Waze full-width bottom ── */
.panel-waze {
  grid-column: 1 / 3;
  /* Override: we put it as a third row, handled differently below */
}

/* ── Scrollbar global ── */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>

    <div class="sncf-body" id="sncf-body"></div>

    <div class="map-wrap">
      <iframe
        src="https://www.google.com/maps/embed/v1/view?key=AIzaSyD-9tSrke72PouQMnMX-a7eZSW0jkFMBWY&center=43.6977,7.2681&zoom=10&maptype=roadmap"
        allowfullscreen loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>
    <div class="map-footer">
      <a class="map-link" href="https://voyage.aprr.fr/information-trafic" target="_blank" rel="noopener">🔗 Carte APRR</a>
      <span class="map-sub">Site APRR — iframe bloqué</span>
    </div>
  </div>

</div><!-- /workspace -->

<!-- ─── Waze pleine largeur en bas ─── -->
<div style="height:260px; flex-shrink:0; display:flex; flex-direction:column; border-top:1px solid var(--border);">
  <div class="panel-header" style="height:40px; background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; display:flex; align-items:center; gap:10px; padding:0 16px;">
    <span class="panel-icon">🗺️</span>
    <span class="panel-title">Waze — Monaco</span>
    <span class="live-dot"></span>
  </div>
  <div style="flex:1; position:relative; overflow:hidden;">
    <iframe
      src="https://embed.waze.com/iframe?zoom=14&lat=43.7384&lon=7.4246&ct=livemap&pin=0"
      style="position:absolute;inset:0;width:100%;height:100%;border:none;"
      allowfullscreen loading="lazy"
    ></iframe>
  </div>
</div>

<script>
const WORKER = 'https://sncf-proxy.nicolas7lejeune.workers.dev';

const STATIONS = [
  { id: 'stop_area:SNCF:87756294', name: 'Cannes' },
  { id: 'stop_area:SNCF:87756403', name: 'Nice-Ville' },
  { id: 'stop_area:SNCF:87756478', name: 'Monaco Monte-Carlo' },
  { id: 'stop_area:SNCF:87756494', name: 'Menton' },
];

// Clock
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('fr-FR', { hour12:false });
}
setInterval(updateClock, 1000);
updateClock();

// Helpers
function fmtTime(dt) {
  if (!dt || dt.length < 13) return '--:--';
  return dt.slice(9,11) + ':' + dt.slice(11,13);
}

function statusOf(dep) {
  if (dep._cancelled) return 'cancelled';
  const e = (dep.display_informations?.effect || '').toUpperCase();
  if (e === 'NO_SERVICE') return 'cancelled';
  if (e.includes('DELAY') || dep._delayMin > 0) return 'delayed';
  if (e.includes('MODIFIED') || e.includes('REDUCED') || e.includes('DETOUR') || e.includes('TERMINUS')) return 'modified';
  return 'ok';
}

function statusLbl(s) {
  return {
    cancelled: 'Train supprimé',
    delayed:   'Retardé',
    modified:  'Terminus exceptionnel',
    ok:        'À l\'heure'
  }[s];
}

function badgeHtml(dep) {
  const s = statusOf(dep);
  if (s === 'cancelled') return '<span class="dep-badge cancelled">Supprimé</span>';
  const e = (dep.display_informations?.effect || '').toUpperCase();
  if (e.includes('MODIFIED') || e.includes('REDUCED') || e.includes('TERMINUS'))
    return '<span class="dep-badge modified">Modifié</span>';
  if (dep._delayMin > 0) {
    const h = Math.floor(dep._delayMin/60), m = dep._delayMin%60;
    const lbl = h > 0 ? '+'+h+'h'+String(m).padStart(2,'0') : '+'+dep._delayMin+' min';
    const cls = dep._delayMin >= 30 ? 'delayed-big' : 'delayed-minor';
    return '<span class="dep-badge '+cls+'">'+lbl+'</span>';
  }
  return '<span class="dep-badge ok">À l\'heure</span>';
}

function warnIcon(dep) {
  const s = statusOf(dep);
  if (s === 'cancelled' || s === 'modified') return '⚠️';
  return '';
}

function buildRow(dep) {
  const s    = statusOf(dep);
  const time = fmtTime(dep.stop_date_time?.departure_date_time || dep.stop_date_time?.base_departure_date_time);
  const dest = dep.display_informations?.direction || dep.display_informations?.headsign || '—';
  const num  = dep.display_informations?.headsign || dep.display_informations?.trip_short_name || '';
  const voie = dep._platform || '';
  const isCancelled = s === 'cancelled';
  const isModified  = s === 'modified';

  return `<div class="dep-row">
    <div class="dep-bar ${s}"></div>
    <div class="dep-time-col">
      <span class="dep-status-lbl ${s}">${statusLbl(s)}</span>
      <span class="dep-time ${isCancelled?'cancelled':''}">${time}</span>
    </div>
    <div class="dep-warn">${warnIcon(dep)}</div>
    <div class="dep-delay-col">${badgeHtml(dep)}</div>
    <div class="dep-dest">
      <span class="dep-dest-main ${(isCancelled||isModified)?'striked':''}">${dest}</span>
      <span class="dep-dest-sub">${num ? 'ZOU ! | '+num : ''}</span>
    </div>
    <div class="dep-voie"><span>Voie</span><span>${voie||'—'}</span></div>
  </div>`;
}

// Load one station
async function loadStation(station, boardEl) {
  boardEl.innerHTML = '<div class="board-msg">Chargement…</div>';
  try {
    const r = await fetch(WORKER+'/passages?stopId='+encodeURIComponent(station.id)+'&count=9');
    if (!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    const deps = (data.departures||[]).slice(0,7);
    if (!deps.length) {
      boardEl.innerHTML = '<div class="board-msg">Aucun train à venir</div>';
      return;
    }
    boardEl.innerHTML = deps.map(buildRow).join('');
  } catch(e) {
    boardEl.innerHTML = '<div class="board-msg" style="color:#ff6b6b">'+e.message+'</div>';
  }
}

function loadAllStations() {
  const body = document.getElementById('sncf-body');
  body.innerHTML = '';
  STATIONS.forEach(s => {
    const col = document.createElement('div');
    col.className = 'station-col';
    const safeId = s.id.replace(/[:.]/g,'_');
    col.innerHTML = `
      <div class="station-name"><span>${s.name}</span><span class="dot"></span></div>
      <div class="departure-board" id="board_${safeId}"></div>`;
    body.appendChild(col);
    loadStation(s, col.querySelector('.departure-board'));
  });
}

// Load disruptions
async function loadDisruptions() {
  const el = document.getElementById('dis-body');
  el.innerHTML = '<div class="board-msg">Chargement…</div>';
  try {
    const r = await fetch(WORKER+'/disruptions');
    if (!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    const list = data.disruptions||[];
    if (!list.length) {
      el.innerHTML = '<div class="no-dis">✔ Aucune perturbation signalée</div>';
      return;
    }
    const badgeCls = e=>({NO_SERVICE:'NO_SERVICE',SIGNIFICANT_DELAYS:'SIGNIFICANT_DELAYS',
      REDUCED_SERVICE:'REDUCED_SERVICE',MODIFIED_SERVICE:'MODIFIED_SERVICE'}[e]||'default');
    const badgeLbl = e=>({NO_SERVICE:'Supprimé',SIGNIFICANT_DELAYS:'Retard important',
      REDUCED_SERVICE:'Service réduit',MODIFIED_SERVICE:'Parcours modifié'}[e]||(e||'Perturbation'));
    const sevCls = d => {
      const e=(d.severity?.effect||'').toUpperCase();
      return e==='NO_SERVICE'?'severe':e.includes('MODIFIED')||e.includes('REDUCED')?'modified':'';
    };
    const fmtPer = p => {
      if(!p?.length) return '';
      const f=p[0].begin?new Date(p[0].begin).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'';
      const t=p[0].end?new Date(p[0].end).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'';
      return f&&t?'Du '+f+' au '+t:f?'Depuis le '+f:'';
    };
    el.innerHTML = list.slice(0,15).map(d=>{
      const eff=d.severity?.effect||'';
      const msg=(d.messages||[]).find(m=>m.channel?.types?.includes('web')||m.channel?.types?.includes('notification'));
      const text=(msg?.text||'').slice(0,160);
      const trains=(d._trains||[]).slice(0,4).join(', ');
      const stops=(d._stops||[]).slice(0,4).map(s=>s.name).join(', ');
      const per=fmtPer(d.application_periods);
      return `<div class="dis-item ${sevCls(d)}">
        <div class="dis-head">
          <span class="dis-train">${trains||stops||'Perturbation réseau'}</span>
          <span class="dis-badge ${badgeCls(eff)}">${badgeLbl(eff)}</span>
        </div>
        ${text?'<div class="dis-text">'+text+'</div>':''}
        ${per?'<div class="dis-period">'+per+'</div>':''}
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = '<div class="board-msg" style="color:#ff6b6b">'+e.message+'</div>';
  }
}

// Init
loadAllStations();
loadDisruptions();
setInterval(()=>{loadAllStations();loadDisruptions();}, 60000);
</script>
</body>
</html>
