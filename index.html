<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Monaco — Utility Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Share+Tech+Mono&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red:    #E4032E;
    --dark:   #37333E;
    --black:  #0D0D0D;
    --panel:  #111318;
    --card:   #191C23;
    --border: #2A2D36;
    --text:   #E8EAF0;
    --muted:  #7A7F8E;
    --yellow: #F5C518;
    --orange: #FF6B35;
    --green:  #2ECC71;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ─────────────────────────────────────────── */
  header {
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 72px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .header-logo {
    height: 44px;
    width: auto;
  }

  .header-divider {
    width: 1px;
    height: 32px;
    background: rgba(255,255,255,0.35);
  }

  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #fff;
    text-transform: uppercase;
    opacity: 0.92;
  }

  .clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 28px;
    color: #fff;
    letter-spacing: 0.06em;
  }

  /* ── MAIN LAYOUT ────────────────────────────────────── */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 24px 40px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ── SECTION PANELS ──────────────────────────────────── */
  .section-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }

  .section-icon { font-size: 18px; }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text);
  }

  .section-badge {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  .section-badge.live {
    color: var(--green);
    border-color: var(--green);
    animation: pulse-badge 2s ease-in-out infinite;
  }

  @keyframes pulse-badge {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .section-body { padding: 16px 20px; }

  /* ── STATIONS GRID ────────────────────────────────────── */
  .stations-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  .station-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .station-name {
    background: var(--dark);
    padding: 10px 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .station-name .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .train-list { display: flex; flex-direction: column; }

  /* ── TRAIN ROW ────────────────────────────────────────── */
  .train-row {
    display: grid;
    grid-template-columns: 4px 100px 84px 1fr 56px;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.15s;
  }

  .train-row:hover { background: rgba(255,255,255,0.03); }
  .train-row:last-child { border-bottom: none; }

  .train-status-bar {
    width: 4px; height: 36px;
    border-radius: 2px;
    flex-shrink: 0;
    align-self: stretch;
  }
  .train-status-bar.delayed  { background: var(--yellow); }
  .train-status-bar.cancelled{ background: var(--red); }
  .train-status-bar.modified { background: var(--orange); }
  .train-status-bar.ok       { background: var(--green); }

  .train-time-block { display: flex; flex-direction: column; gap: 2px; }

  .train-status-label {
    font-size: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .train-status-label.delayed  { color: var(--yellow); }
  .train-status-label.cancelled{ color: var(--red); }
  .train-status-label.modified { color: var(--orange); }
  .train-status-label.ok       { color: var(--green); }

  .train-time {
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--yellow);
    line-height: 1;
  }
  .train-time.cancelled { color: var(--muted); text-decoration: line-through; }

  .train-delay {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--red);
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    min-width: 64px;
  }
  .train-delay.minor    { background: #c47a00; }
  .train-delay.ok       { background: var(--green); color: #000; }
  .train-delay.modified { background: var(--orange); }

  .train-dest { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }

  .train-dest-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 15px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .train-dest-sub {
    font-size: 11px; color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
  }

  .train-voie {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 8px;
    line-height: 1.2;
  }
  .train-voie span:first-child { font-size: 9px; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; }
  .train-voie span:last-child  { font-size: 16px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; }

  .loading-trains {
    padding: 20px; text-align: center;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px; color: var(--muted);
  }

  .error-msg {
    padding: 12px 16px; color: #ff6b6b;
    font-family: 'Share Tech Mono', monospace; font-size: 12px;
    background: rgba(228,3,46,0.1); border-radius: 6px; margin: 10px;
  }

  /* ── PERTURBATIONS ───────────────────────────────────── */
  .disruption-list { display: flex; flex-direction: column; gap: 10px; }

  .disruption-item {
    background: var(--card); border-radius: 8px;
    border-left: 4px solid var(--yellow);
    padding: 12px 16px;
    display: grid; grid-template-columns: 1fr auto;
    gap: 8px; align-items: start;
  }
  .disruption-item.severe   { border-left-color: var(--red); }
  .disruption-item.modified { border-left-color: var(--orange); }

  .disruption-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 4px;
  }
  .disruption-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

  .disruption-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    padding: 3px 10px; border-radius: 20px;
    text-transform: uppercase; white-space: nowrap;
  }
  .disruption-badge.NO_SERVICE        { background: var(--red); color: #fff; }
  .disruption-badge.SIGNIFICANT_DELAYS{ background: var(--yellow); color: #000; }
  .disruption-badge.REDUCED_SERVICE   { background: var(--orange); color: #fff; }
  .disruption-badge.MODIFIED_SERVICE  { background: #6c5ce7; color: #fff; }
  .disruption-badge.default           { background: var(--border); color: var(--text); }

  .no-disruptions {
    display: flex; align-items: center; gap: 10px; padding: 16px;
    color: var(--green); font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; font-weight: 600; letter-spacing: 0.08em;
  }

  /* ── MAPS GRID ───────────────────────────────────────── */
  .maps-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
  }

  .map-iframe-wrap {
    position: relative; width: 100%; padding-top: 62%;
    border-radius: 8px; overflow: hidden; background: #0a0a0a;
  }
  .map-iframe-wrap iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: none;
  }

  .map-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--red); color: #fff; text-decoration: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 9px 18px; border-radius: 6px;
    transition: opacity 0.2s; margin-top: 10px;
  }
  .map-btn:hover { opacity: 0.85; }

  .refresh-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: auto; background: transparent;
    border: 1px solid var(--border); color: var(--muted);
    border-radius: 5px; padding: 5px 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; cursor: pointer; transition: all 0.2s;
  }
  .refresh-btn:hover { border-color: var(--red); color: var(--red); }

  @media (max-width: 900px) {
    .stations-grid, .maps-grid { grid-template-columns: 1fr; }
    .train-voie { display: none; }
    .train-row { grid-template-columns: 4px 90px 76px 1fr; }
  }
</style>
</head>

<script>
const WORKER = 'https://sncf-proxy.nicolas7lejeune.workers.dev';

const STATIONS = [
  { id: 'stop_area:SNCF:87756294', name: 'Cannes' },
  { id: 'stop_area:SNCF:87756403', name: 'Nice-Ville' },
  { id: 'stop_area:SNCF:87756478', name: 'Monaco Monte-Carlo' },
  { id: 'stop_area:SNCF:87756494', name: 'Menton' },
];

// Clock
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('fr-FR', { hour12: false });
}
setInterval(updateClock, 1000);
updateClock();

// Helpers
function fmtTime(dt) {
  if (!dt || dt.length < 13) return '--:--';
  return dt.slice(9,11) + ':' + dt.slice(11,13);
}

function statusOf(dep) {
  if (dep._cancelled) return 'cancelled';
  const e = (dep.display_informations?.effect || '').toUpperCase();
  if (e === 'NO_SERVICE') return 'cancelled';
  if (e.includes('DELAY') || dep._delayMin > 0) return 'delayed';
  if (e.includes('MODIFIED') || e.includes('REDUCED') || e.includes('DETOUR')) return 'modified';
  return 'ok';
}

function statusLbl(s) {
  return { cancelled: 'Supprimé', delayed: 'Retardé', modified: 'Parcours modifié', ok: 'À l\'heure' }[s];
}

function delayTag(dep) {
  if (dep._cancelled) return '<span class="train-delay">Supprimé</span>';
  const e = (dep.display_informations?.effect || '').toUpperCase();
  if (e.includes('MODIFIED') || e.includes('REDUCED'))
    return '<span class="train-delay modified">Modifié</span>';
  if (dep._delayMin > 0) {
    const h = Math.floor(dep._delayMin / 60), m = dep._delayMin % 60;
    const lbl = h > 0 ? '+' + h + 'h' + String(m).padStart(2,'0') : '+' + dep._delayMin + ' min';
    return '<span class="train-delay' + (dep._delayMin < 30 ? ' minor' : '') + '">' + lbl + '</span>';
  }
  return '<span class="train-delay ok">À l\'heure</span>';
}

function buildRow(dep) {
  const s    = statusOf(dep);
  const time = fmtTime(dep.stop_date_time?.departure_date_time || dep.stop_date_time?.base_departure_date_time);
  const dest = dep.display_informations?.direction || dep.display_informations?.headsign || '—';
  const num  = dep.display_informations?.headsign || dep.display_informations?.trip_short_name || '';
  const voie = dep._platform || '';
  return `
    <div class="train-row">
      <div class="train-status-bar ${s}"></div>
      <div class="train-time-block">
        <span class="train-status-label ${s}">${statusLbl(s)}</span>
        <span class="train-time ${s === 'cancelled' ? 'cancelled' : ''}">${time}</span>
      </div>
      ${delayTag(dep)}
      <div class="train-dest">
        <span class="train-dest-name">${dest}</span>
        <span class="train-dest-sub">${num ? 'ZOU ! | ' + num : ''}</span>
      </div>
      <div class="train-voie"><span>Voie</span><span>${voie || '—'}</span></div>
    </div>`;
}

// Load departures
async function loadStation(station, el) {
  el.innerHTML = '<div class="loading-trains">Chargement…</div>';
  try {
    const r = await fetch(WORKER + '/passages?stopId=' + encodeURIComponent(station.id) + '&count=8');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const deps = (data.departures || []).slice(0, 6);
    if (!deps.length) { el.innerHTML = '<div class="loading-trains" style="color:var(--muted)">Aucun train à venir.</div>'; return; }
    el.innerHTML = deps.map(buildRow).join('');
  } catch(e) {
    el.innerHTML = '<div class="error-msg">Erreur : ' + e.message + '</div>';
  }
}

function loadAllStations() {
  const grid = document.getElementById('stations-grid');
  grid.innerHTML = '';
  STATIONS.forEach(s => {
    const block = document.createElement('div');
    block.className = 'station-block';
    const safeId = s.id.replace(/[:.]/g,'_');
    block.innerHTML = `
      <div class="station-name"><span>${s.name}</span><span class="dot"></span></div>
      <div class="train-list" id="tl_${safeId}"></div>`;
    grid.appendChild(block);
    loadStation(s, block.querySelector('.train-list'));
  });
}

// Load disruptions
async function loadDisruptions() {
  const el = document.getElementById('disruptions-list');
  el.innerHTML = '<div class="loading-trains">Chargement des perturbations…</div>';
  try {
    const r = await fetch(WORKER + '/disruptions');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const list = data.disruptions || [];
    if (!list.length) {
      el.innerHTML = '<div class="no-disruptions">✔ Aucune perturbation signalée sur les 4 gares.</div>';
      return;
    }
    const badgeCls = e => ({ NO_SERVICE:'NO_SERVICE', SIGNIFICANT_DELAYS:'SIGNIFICANT_DELAYS',
      REDUCED_SERVICE:'REDUCED_SERVICE', MODIFIED_SERVICE:'MODIFIED_SERVICE' }[e] || 'default');
    const badgeLbl = e => ({ NO_SERVICE:'Supprimé', SIGNIFICANT_DELAYS:'Retard important',
      REDUCED_SERVICE:'Service réduit', MODIFIED_SERVICE:'Parcours modifié' }[e] || (e || 'Perturbation'));
    const sevCls  = d => { const e = (d.severity?.effect||'').toUpperCase();
      return e==='NO_SERVICE'?'severe':e.includes('MODIFIED')||e.includes('REDUCED')?'modified':''; };
    const fmtPer = p => {
      if (!p?.length) return '';
      const f = p[0].begin ? new Date(p[0].begin).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}) : '';
      const t = p[0].end   ? new Date(p[0].end).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}) : '';
      return f&&t ? 'Du '+f+' au '+t : f ? 'Depuis le '+f : '';
    };
    el.innerHTML = '<div class="disruption-list">' + list.slice(0,10).map(d => {
      const effect = d.severity?.effect || '';
      const msg = (d.messages||[]).find(m=>m.channel?.types?.includes('web')||m.channel?.types?.includes('notification'));
      const text = (msg?.text||'').slice(0,200);
      const trains = (d._trains||[]).slice(0,4).join(', ');
      const stops  = (d._stops||[]).slice(0,4).map(s=>s.name).join(', ');
      const period = fmtPer(d.application_periods);
      return `<div class="disruption-item ${sevCls(d)}">
        <div>
          <div class="disruption-title">${trains||stops||'Perturbation réseau'}</div>
          <div class="disruption-desc">${text}${period?' — '+period:''}</div>
        </div>
        <span class="disruption-badge ${badgeCls(effect)}">${badgeLbl(effect)}</span>
      </div>`;
    }).join('') + '</div>';
  } catch(e) {
    el.innerHTML = '<div class="error-msg">Erreur : ' + e.message + '</div>';
  }
}

// Init
loadAllStations();
loadDisruptions();
setInterval(() => { loadAllStations(); loadDisruptions(); }, 60000);
</script>
