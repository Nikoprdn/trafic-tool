<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Radio Monaco — Studio Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Share+Tech+Mono&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<!-- TomTom Maps SDK -->
<link rel="stylesheet" href="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps.css">
<script src="https://api.tomtom.com/maps-sdk-for-web/cdn/6.x/6.25.0/maps/maps-web.min.js"></script>
<style>

:root{--red:#E4032E;--bg:#0D1016;--panel:#12151C;--card:#181B26;--border:#232730;--text:#E8EAF0;--muted:#5E6474;--muted2:#42465A;--yellow:#F5C518;--orange:#FF6B35;--green:#27AE60;--sb-bg:#003580;--sb-head:#002055;--sb-row:#004AC0;--sb-alt:#0041A8;--sb-sep:rgba(255,255,255,.06);--blue-deep:#071830;--blue-mid:#0A2A5E;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);min-height:100vh;font-family:'Barlow',sans-serif;}
.hdr{background:var(--red);height:84px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:0 36px;gap:32px;position:sticky;top:0;z-index:100;box-shadow:0 4px 28px rgba(0,0,0,.7);}
.hdr-left{display:flex;align-items:center;gap:20px;}
.hdr-logo{height:68px;width:auto;filter:brightness(0) invert(1);}
.hdr-sep{width:1px;height:40px;background:rgba(255,255,255,.22);}
.hdr-app-title{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.8);text-transform:uppercase;}
.hdr-tabs{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:5px;}
.tab-btn{display:flex;align-items:center;gap:8px;padding:8px 22px;border-radius:5px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);cursor:pointer;border:none;background:transparent;transition:all .2s;white-space:nowrap;}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,.08);}
.tab-btn.active{background:#fff;color:var(--red);}
.tab-btn .ti{font-size:16px;}
.hdr-clock{font-family:'Share Tech Mono',monospace;font-size:30px;color:#fff;text-align:right;white-space:nowrap;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.wrap{max-width:1600px;margin:0 auto;padding:22px 28px 48px;}

/* BLUE CARD */
.bc{background:var(--hero-grad);border:1px solid var(--hero-border);border-radius:12px;position:relative;overflow:hidden;margin-bottom:20px;}
.bc::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 30%,rgba(80,160,255,.07) 0%,transparent 60%);pointer-events:none;}
.bc-head{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:46px;border-bottom:1px solid rgba(255,255,255,.08);position:relative;}
.bc-title{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.7);}
.bc-meta{display:flex;align-items:center;gap:14px;}
.bc-minmax{font-family:'Share Tech Mono',monospace;font-size:16px;color:var(--yellow);}
.bc-minmax span{color:rgba(255,255,255,.3);font-size:13px;}
.bc-cond{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.05em;}

/* SECTION LABEL */
.w-section-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:8px;margin-top:4px;padding-left:2px;display:flex;align-items:center;gap:10px;}
.w-section-label::before{content:'';display:inline-block;width:22px;height:1px;background:rgba(255,255,255,.18);}

/* SUB TABS */
.w-sub-tabs{display:flex;gap:4px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:4px;margin-bottom:20px;}
.w-sub-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);cursor:pointer;border:none;background:transparent;transition:all .2s;white-space:nowrap;}
.w-sub-btn:hover{color:#fff;background:rgba(255,255,255,.06);}
.w-sub-btn.active{background:rgba(255,255,255,.12);color:#fff;}
.w-sub-content{display:none;}
.w-sub-content.active{display:block;}

/* WEATHER */
.w-hero{background:var(--hero-grad);border:1px solid var(--hero-border);border-radius:12px;padding:28px 36px;margin-bottom:20px;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;position:relative;overflow:hidden;}
.w-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 40%,rgba(100,180,255,.08) 0%,transparent 60%);pointer-events:none;}
.w-hero-loc{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:4px;}
.w-hero-cond{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;color:rgba(255,255,255,.85);margin-bottom:18px;}
.w-hero-meta{display:flex;gap:28px;flex-wrap:wrap;}
.w-meta-item{display:flex;flex-direction:column;gap:2px;}
.w-meta-label{font-size:10px;color:rgba(255,255,255,.35);font-family:'Share Tech Mono',monospace;letter-spacing:.06em;text-transform:uppercase;}
.w-meta-val{font-family:'Share Tech Mono',monospace;font-size:14px;color:rgba(255,255,255,.8);}
.w-hero-right{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;}
.w-hero-icon{font-size:60px;line-height:1;filter:drop-shadow(0 4px 16px rgba(0,0,0,.3));}
.w-hero-temp{font-family:'Share Tech Mono',monospace;font-size:70px;font-weight:700;color:#fff;line-height:1;}
.w-hero-region{font-size:12px;color:rgba(255,255,255,.4);font-family:'Barlow Condensed',sans-serif;letter-spacing:.06em;margin-top:2px;}
.w-days-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
.w-timeline{display:grid;grid-template-columns:repeat(6,1fr);padding:20px 0 16px;}
.w-slot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 8px;border-right:1px solid rgba(255,255,255,.06);}
.w-slot:last-child{border-right:none;}
.w-slot-hour{font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(255,255,255,.35);}
.w-slot-icon{font-size:24px;line-height:1;}
.w-slot-temp{font-family:'Share Tech Mono',monospace;font-size:22px;font-weight:700;color:var(--yellow);}
.w-slot-pop{font-family:'Share Tech Mono',monospace;font-size:11px;color:#5A9FEF;}
.w-slot-pop.zero{color:rgba(255,255,255,.2);}
.w-day-toggle{display:flex;gap:4px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:3px;margin-bottom:12px;width:fit-content;}
.w-day-btn{padding:6px 20px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);cursor:pointer;border:none;background:transparent;transition:all .2s;white-space:nowrap;}
.w-day-btn:hover{color:#fff;background:rgba(255,255,255,.06);}
.w-day-btn.active{background:rgba(255,255,255,.12);color:#fff;}
.w-cities-grid{display:grid;grid-template-columns:repeat(6,1fr);}
.w-city{padding:18px 10px 20px;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;}
.w-city:last-child{border-right:none;}
.w-city-badge{position:absolute;top:8px;right:8px;font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:10px;}
.w-city-badge.fixed{background:rgba(39,174,96,.12);color:rgba(39,174,96,.7);border:1px solid rgba(39,174,96,.2);}
.w-city-badge.rotate{background:rgba(245,197,24,.08);color:rgba(245,197,24,.55);border:1px solid rgba(245,197,24,.18);}
.w-city-name{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.65);text-align:center;}
.w-city-periods{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;}
.w-period{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:10px 4px;}
.w-period-lbl{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);}
.w-period-temp{font-family:'Share Tech Mono',monospace;font-size:22px;font-weight:700;color:var(--yellow);line-height:1;}
.w-period-cond{font-family:'Barlow Condensed',sans-serif;font-size:9px;color:rgba(255,255,255,.3);text-align:center;line-height:1.2;}
@keyframes fadeCity{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.w-city.entering{animation:fadeCity .35s ease;}

/* VIGILANCES */
.vig-grid{display:grid;grid-template-columns:repeat(3,1fr);}
.vig-dept{padding:20px 24px;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:12px;}
.vig-dept:last-child{border-right:none;}
.vig-dept-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.8);margin-bottom:4px;}
.vig-list{display:flex;flex-direction:column;gap:8px;}
.vig-item{display:flex;align-items:center;gap:10px;}
.vig-color{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.vig-color.vert{background:#27AE60;}.vig-color.jaune{background:#F5C518;}.vig-color.orange{background:#FF6B35;}.vig-color.rouge{background:#E4032E;}
.vig-pheno{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.04em;}
.vig-pheno.vert{color:rgba(39,174,96,.7);}.vig-pheno.jaune{color:var(--yellow);}.vig-pheno.orange{color:var(--orange);}.vig-pheno.rouge{color:#ff7070;}
.vig-ok{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:rgba(39,174,96,.7);letter-spacing:.05em;}
.w-loading{display:flex;align-items:center;justify-content:center;padding:36px;font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(255,255,255,.25);}
.w-err{color:#ff8080 !important;}
.w-source{text-align:center;font-family:'Share Tech Mono',monospace;font-size:10px;color:rgba(255,255,255,.2);padding:12px;margin-top:4px;}

/* TRAFIC */
.section-card{background:var(--sc-bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.card-h{display:flex;align-items:center;gap:12px;padding:0 20px;height:48px;background:var(--card);border-bottom:1px solid var(--border);}
.card-t{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;}
.pill{display:flex;align-items:center;gap:5px;background:rgba(39,174,96,.1);border:1px solid rgba(39,174,96,.3);border-radius:20px;padding:2px 9px;font-size:10px;color:var(--green);font-family:'Share Tech Mono',monospace;white-space:nowrap;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:bdot 2s ease-in-out infinite;}
@keyframes bdot{0%,100%{opacity:1}50%{opacity:.15}}
.rbtn{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:4px 14px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.rbtn:hover{border-color:var(--red);color:var(--red);}
.tbtn{background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.4);color:var(--yellow);border-radius:4px;padding:4px 14px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
.tbtn:hover{background:rgba(245,197,24,.22);}
.stations-grid{display:grid;grid-template-columns:1fr 1fr;}
.st-panel{border-right:1px solid var(--border);}
.st-panel:nth-child(even){border-right:none;}
.st-panel:nth-child(1),.st-panel:nth-child(2){border-bottom:1px solid var(--border);}
.st-head{background:var(--sb-head);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.07);}
.st-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.85);}
.st-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:bdot 2s ease-in-out infinite;}
.st-board{background:var(--sb-bg);}
.train-row{display:grid;grid-template-columns:5px 130px 100px 1fr 60px;align-items:stretch;min-height:60px;border-bottom:1px solid var(--sb-sep);background:var(--sb-row);}
.train-row:nth-child(even){background:var(--sb-alt);}
.train-row:last-child{border-bottom:none;}
.tr-bar{align-self:stretch;}
.tr-bar.ok{background:var(--green);}.tr-bar.delayed{background:var(--orange);}.tr-bar.cancelled{background:var(--red);}.tr-bar.modified{background:var(--orange);}
.tr-tc{display:flex;flex-direction:column;justify-content:center;padding:6px 10px 6px 16px;gap:2px;}
.tr-status{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:400;font-style:italic;line-height:1;color:rgba(255,255,255,.6);}
.tr-status.delayed{color:var(--orange);}.tr-status.cancelled{color:#ff8080;}.tr-status.modified{color:var(--orange);}.tr-status.ok{color:rgba(255,255,255,.38);}
.tr-time{font-family:'Share Tech Mono',monospace;font-size:26px;font-weight:700;color:var(--yellow);line-height:1;}
.tr-time.cancelled{color:var(--muted);text-decoration:line-through;}
.tr-badge-wrap{display:flex;align-items:center;justify-content:center;padding:0 8px;}
.tr-badge{display:inline-flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;padding:5px 14px;border-radius:22px;white-space:nowrap;}
.tr-badge.big{background:#B50020;color:#fff;}.tr-badge.minor{background:#C85800;color:#fff;}.tr-badge.gone{background:rgba(180,0,0,.2);color:#ff8080;border:1px solid rgba(255,80,80,.3);font-size:12px;}.tr-badge.modif{background:#7B4000;color:#FFBB80;}
.tr-badge-wrap.delayed-cell{padding:0;}
.t-flip{position:relative;width:100px;height:60px;display:flex;align-items:center;justify-content:center;}
.t-flip .va{position:absolute;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:rgba(255,255,255,.4);text-decoration:line-through;animation:va 4s ease-in-out infinite;}
.t-flip .vb{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;animation:vb 4s ease-in-out infinite;}
.vb-lbl{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;background:var(--orange);color:#fff;padding:4px 12px;border-radius:16px;}
@keyframes va{0%{opacity:1;}38%{opacity:1;}48%{opacity:0;}100%{opacity:0;}}
@keyframes vb{0%{opacity:0;}38%{opacity:0;}48%{opacity:1;}95%{opacity:1;}100%{opacity:0;}}
.tr-dest{display:flex;flex-direction:column;justify-content:center;padding:6px 12px;overflow:hidden;}
.tr-dname{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;}
.tr-dname.x{text-decoration:line-through;color:var(--muted);font-weight:400;}
.tr-dsub{font-family:'Share Tech Mono',monospace;font-size:9.5px;color:rgba(255,255,255,.32);margin-top:3px;}
.tr-voie{display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.18);padding:0 8px;}
.tr-voie-lbl{font-size:8px;color:rgba(255,255,255,.3);font-family:'Barlow Condensed',sans-serif;letter-spacing:.07em;text-transform:uppercase;}
.tr-voie-box{background:#fff;border-radius:5px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.tr-voie-v{font-size:20px;font-family:'Barlow Condensed',sans-serif;font-weight:800;color:#222;line-height:1;}
.tr-voie-box.empty{background:rgba(255,255,255,.1);}
.tr-voie-box.empty .tr-voie-v{color:rgba(255,255,255,.2);font-size:14px;}
.board-msg{display:flex;align-items:center;justify-content:center;padding:28px;font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(255,255,255,.22);background:var(--sb-bg);}
.board-err{color:#ff8080 !important;}
/* dis inside sncf card */
.dis-merge-head{display:flex;align-items:center;gap:12px;padding:0 20px;height:44px;background:var(--card);border-bottom:1px solid var(--border);border-top:2px solid var(--border);}
.dis-wrap{padding:14px 20px;display:flex;flex-direction:column;gap:10px;}
.dis-item{background:var(--dis-bg);border-radius:7px;border-left:3px solid var(--yellow);overflow:hidden;}
.dis-item.severe{border-left-color:var(--red);}.dis-item.modified{border-left-color:var(--orange);}.dis-item.info{border-left-color:#4a90e2;}.dis-item.test-mode{outline:1px dashed rgba(245,197,24,.35);}
.dis-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px 8px;}
.dis-badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:.08em;padding:3px 10px;border-radius:20px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.dis-badge.NO_SERVICE{background:rgba(228,3,46,.18);color:#ff8080;border:1px solid rgba(228,3,46,.4);}
.dis-badge.SIGNIFICANT_DELAYS{background:rgba(245,197,24,.12);color:var(--yellow);border:1px solid rgba(245,197,24,.4);}
.dis-badge.REDUCED_SERVICE{background:rgba(255,107,53,.12);color:var(--orange);border:1px solid rgba(255,107,53,.4);}
.dis-badge.MODIFIED_SERVICE{background:rgba(108,92,231,.12);color:#a29bfe;border:1px solid rgba(108,92,231,.4);}
.dis-badge.default{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--border);}
.dis-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3;}
.dis-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.dis-meta strong{font-weight:600;color:rgba(255,255,255,.55);}
.dis-txt{padding:8px 14px 10px;font-size:12px;color:var(--muted);line-height:1.65;border-top:1px solid var(--border);}
.dis-per{padding:4px 14px 10px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted2);}
.dis-test-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--yellow);opacity:.55;padding:4px 14px 0;}
.no-dis{display:flex;align-items:center;gap:8px;padding:14px 0;color:var(--green);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.08em;}
.map-frame{position:relative;width:100%;padding-top:50%;overflow:hidden;}
.map-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.map-footer{padding:8px 16px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;gap:16px;}
.map-lnk{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;}
.map-lnk.red{color:var(--red);}.map-lnk.muted{color:var(--muted);}

/* TRAVEL TIMES */
.travel-dir-header{
  display:flex;align-items:center;gap:10px;
  padding:14px 24px;
  background:linear-gradient(90deg,rgba(255,255,255,.03) 0%,transparent 100%);
  border-bottom:1px solid var(--border);
}
.travel-dir-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35);}
.travel-dir-arrow{font-size:16px;color:rgba(255,255,255,.2);}
.travel-dir-dest{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;}

/* Column headers */
.travel-col-head{
  display:grid;
  grid-template-columns:1fr 200px 200px;
  padding:8px 24px 8px 28px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  gap:0;
}
.tch-city{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2);}
.tch-opt{
  text-align:center;
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;

.a8-seg{
  height:100%;
  position:relative;
  cursor:pointer;
  transition:filter .12s;
}
.a8-seg:first-child{border-radius:6px 0 0 6px;}
.a8-seg:last-child{border-radius:0 6px 6px 0;}

/* Tooltip */
.a8-seg::after{
  content:attr(data-tooltip);
  position:absolute;
  bottom:calc(100% + 10px);
  left:50%;transform:translateX(-50%);
  background:rgba(13,16,22,.96);
  border:1px solid var(--border);
  border-radius:7px;
  padding:7px 12px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:600;letter-spacing:.04em;
  color:#fff;
  white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .12s;
  z-index:100;
  box-shadow:0 4px 20px rgba(0,0,0,.6);
}
.a8-seg:hover::after{opacity:1;}

/* Tick sur la barre */
.a8-bar-tick{
  position:absolute;top:0;bottom:0;
  width:2px;background:rgba(0,0,0,.25);
  z-index:1;pointer-events:none;
}

.a8-tl-names{

  transform:rotate(-40deg) translateX(2px);
  transform-origin:top left;
  max-width:80px;overflow:hidden;text-overflow:ellipsis;
}

  if(!ff||ff===0) return 'inconnu';
  var r=cur/ff;

  if(r>=0.65) return 'ralenti';
  if(r>=0.45) return 'dense';

function speedLabel(cur, ff){

    var km0 = isEast ? ex0.km : (A8_TOTAL_KM - ex1.km);
    var km1 = isEast ? ex1.km : (A8_TOTAL_KM - ex0.km);
    var pct0 = (km0/A8_TOTAL_KM*100).toFixed(3)+'%';
    var pct1 = (km1/A8_TOTAL_KM*100).toFixed(3)+'%';
    var w    = ((km1-km0)/A8_TOTAL_KM*100).toFixed(3)+'%';

    /* Données trafic pour ce segment */
    var segIdx = isEast ? i : (exits.length-2-i);
    var d = segData[segIdx] || {cur:0,ff:0};
    var cls  = speedClass(d.cur, d.ff);
    var lbl  = speedLabel(d.cur, d.ff);
    if(counts[cls]!==undefined) counts[cls]++;

    var exitLbl = isEast ? ex0.lbl : ex1.lbl;
    var exitNum = isEast ? (ex0.n||'') : (ex1.n||'');
    var tooltip = 'Sortie '+(exitNum?exitNum+' — ':'')+exitLbl
      +' | '+lbl+(d.cur>0?' — '+d.cur+' km/h':'');

    /* Segment de la barre */
    var seg=document.createElement('div');
    seg.className='a8-seg '+cls;
    seg.style.width=w;
    seg.setAttribute('data-tooltip', tooltip);
    bar.appendChild(seg);

    /* Tick + badge numéro au-dessus */
    var numEl=document.createElement('div');
    numEl.className='a8-exit-num';
    numEl.style.left=pct0;
    var badge=isEast?ex0.n:ex1.n;
    numEl.innerHTML='<span class="a8-exit-badge">'+(badge||'')+'</span>'
      +'<div class="a8-exit-tick-top"></div>';
    numsRow.appendChild(numEl);

    /* Nom en dessous */
    var nameEl=document.createElement('div');
    nameEl.className='a8-exit-name';
    nameEl.style.left=pct0;
    var nameStr=isEast?ex0.short:ex1.short;
    nameEl.innerHTML='<div class="a8-exit-tick-bot"></div>'
      +'<span class="a8-exit-lbl">'+nameStr+'</span>';
    namesRow.appendChild(nameEl);

    /* Tick sur la barre */
    if(i>0){
      var t=document.createElement('div');
      t.className='a8-bar-tick';
      t.style.left=pct0;
      bar.appendChild(t);
    }
  }

  /* Dernier échangeur */
  var lastEx = isEast ? displayExits[displayExits.length-1] : displayExits[0];
  var lastNumEl=document.createElement('div');
  lastNumEl.className='a8-exit-num';
  lastNumEl.style.left='100%';
  lastNumEl.innerHTML='<span class="a8-exit-badge" style="background:rgba(228,3,46,.15);border-color:rgba(228,3,46,.4);color:var(--red);">'+(lastEx.lbl)+'</span>'
    +'<div class="a8-exit-tick-top"></div>';
  numsRow.appendChild(lastNumEl);

  var lastNameEl=document.createElement('div');
  lastNameEl.className='a8-exit-name';
  lastNameEl.style.left='100%';
  lastNameEl.innerHTML='<div class="a8-exit-tick-bot"></div>'
    +'<span class="a8-exit-lbl">'+lastEx.short+'</span>';
  namesRow.appendChild(lastNameEl);

  body.appendChild(numsRow);
  body.appendChild(bar);
  body.appendChild(namesRow);

  /* Stats résumé */
  var statHtml='';
  if(counts.bloque >0) statHtml+='<span class="a8-stat bloque">&#9679; '+counts.bloque+' section'+(counts.bloque>1?'s':'')+' bloquée'+(counts.bloque>1?'s':'')+'</span>';
  if(counts.dense  >0) statHtml+='<span class="a8-stat dense">&#9679; '+counts.dense+' dense'+(counts.dense>1?'s':'')+'</span>';
  if(counts.ralenti>0) statHtml+='<span class="a8-stat ralenti">&#9679; '+counts.ralenti+' ralentie'+(counts.ralenti>1?'s':'')+'</span>';
  if(counts.fluide >0 && !counts.bloque && !counts.dense && !counts.ralenti)
    statHtml='<span class="a8-stat fluide">&#9679; Trafic fluide sur tout le tronçon</span>';
  if(statHtml){
    statsRow.innerHTML=statHtml;
    body.appendChild(statsRow);
  }

  wrap.appendChild(body);
  return wrap;
}

function loadA8Traffic(){
  var wrap=document.getElementById('a8-timeline-wrap');
  if(!wrap)return;
  wrap.innerHTML='<div class="a8-tl-loading">Chargement trafic A8...</div>';

  /* Une sonde par section (entre exit[i] et exit[i+1]) */
  var probes=[];
  for(var i=0;i<A8_EXITS.length-1;i++){
    var e0=A8_EXITS[i], e1=A8_EXITS[i+1];
    /* Point milieu approximatif */
    probes.push({lat:(e0.lat+e1.lat)/2, lon:(e0.lon+e1.lon)/2});
  }

  Promise.all(probes.map(function(p){return fetchSeg(p.lat,p.lon);}))
    .then(function(segData){
      wrap.innerHTML='';
      var divider=document.createElement('div');
      divider.style.cssText='height:1px;background:var(--border);margin:6px 0 28px;';
      wrap.appendChild(buildDir(A8_EXITS, segData, true));
      wrap.appendChild(divider);
      wrap.appendChild(buildDir(A8_EXITS, segData, false));
      var u=document.getElementById('a8-upd');
      if(u)u.textContent=new Date().toLocaleTimeString('fr-FR',{hour12:false});
    });
}

document.addEventListener('DOMContentLoaded',function(){setTimeout(loadA8Traffic,500);});
setInterval(loadA8Traffic,300000);

function syncMapTheme(){}
function refreshA8Traffic(){loadA8Traffic();}

.tr-voie{display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.18);padding:0 8px;}
.tr-voie-lbl{font-size:8px;color:rgba(255,255,255,.3);font-family:'Barlow Condensed',sans-serif;letter-spacing:.07em;text-transform:uppercase;}
.tr-voie-box{background:#fff;border-radius:5px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.tr-voie-v{font-size:20px;font-family:'Barlow Condensed',sans-serif;font-weight:800;color:#222;line-height:1;}
.tr-voie-box.empty{background:rgba(255,255,255,.1);}
.tr-voie-box.empty .tr-voie-v{color:rgba(255,255,255,.2);font-size:14px;}
.board-msg{display:flex;align-items:center;justify-content:center;padding:28px;font-family:'Share Tech Mono',monospace;font-size:11px;color:rgba(255,255,255,.22);background:var(--sb-bg);}
.board-err{color:#ff8080 !important;}
/* dis inside sncf card */
.dis-merge-head{display:flex;align-items:center;gap:12px;padding:0 20px;height:44px;background:var(--card);border-bottom:1px solid var(--border);border-top:2px solid var(--border);}
.dis-wrap{padding:14px 20px;display:flex;flex-direction:column;gap:10px;}
.dis-item{background:var(--dis-bg);border-radius:7px;border-left:3px solid var(--yellow);overflow:hidden;}
.dis-item.severe{border-left-color:var(--red);}.dis-item.modified{border-left-color:var(--orange);}.dis-item.info{border-left-color:#4a90e2;}.dis-item.test-mode{outline:1px dashed rgba(245,197,24,.35);}
.dis-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px 8px;}
.dis-badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:.08em;padding:3px 10px;border-radius:20px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.dis-badge.NO_SERVICE{background:rgba(228,3,46,.18);color:#ff8080;border:1px solid rgba(228,3,46,.4);}
.dis-badge.SIGNIFICANT_DELAYS{background:rgba(245,197,24,.12);color:var(--yellow);border:1px solid rgba(245,197,24,.4);}
.dis-badge.REDUCED_SERVICE{background:rgba(255,107,53,.12);color:var(--orange);border:1px solid rgba(255,107,53,.4);}
.dis-badge.MODIFIED_SERVICE{background:rgba(108,92,231,.12);color:#a29bfe;border:1px solid rgba(108,92,231,.4);}
.dis-badge.default{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--border);}
.dis-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3;}
.dis-meta{font-size:12px;color:var(--muted);margin-top:2px;}
.dis-meta strong{font-weight:600;color:rgba(255,255,255,.55);}
.dis-txt{padding:8px 14px 10px;font-size:12px;color:var(--muted);line-height:1.65;border-top:1px solid var(--border);}
.dis-per{padding:4px 14px 10px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted2);}
.dis-test-lbl{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--yellow);opacity:.55;padding:4px 14px 0;}
.no-dis{display:flex;align-items:center;gap:8px;padding:14px 0;color:var(--green);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:.08em;}
.map-frame{position:relative;width:100%;padding-top:50%;overflow:hidden;}
.map-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.map-footer{padding:8px 16px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;gap:16px;}
.map-lnk{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;}
.map-lnk.red{color:var(--red);}.map-lnk.muted{color:var(--muted);}

/* TRAVEL TIMES */
.travel-dir-header{
  display:flex;align-items:center;gap:10px;
  padding:14px 24px;
  background:linear-gradient(90deg,rgba(255,255,255,.03) 0%,transparent 100%);
  border-bottom:1px solid var(--border);
}
.travel-dir-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35);}
.travel-dir-arrow{font-size:16px;color:rgba(255,255,255,.2);}
.travel-dir-dest{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff;}

/* Column headers */
.travel-col-head{
  display:grid;
  grid-template-columns:1fr 200px 200px;
  padding:8px 24px 8px 28px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  gap:0;
}
.tch-city{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted2);}
.tch-opt{
  text-align:center;
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.tch-opt .tch-icon{font-size:14px;}
.tch-opt .tch-lbl{color:var(--muted);}
.tch-opt.with  .tch-lbl{color:rgba(39,174,96,.7);}
.tch-opt.noaut .tch-lbl{color:rgba(245,197,24,.6);}

/* Route rows */
.travel-list{display:flex;flex-direction:column;}
.travel-row{
  display:grid;
  grid-template-columns:4px 1fr 200px 200px;
  align-items:center;
  min-height:72px;
  border-bottom:1px solid rgba(255,255,255,.04);
  transition:background .12s;
}
.travel-row:last-child{border-bottom:none;}
.travel-row:hover{background:rgba(255,255,255,.025);}

/* Left color bar */
.t-bar{align-self:stretch;border-radius:0 2px 2px 0;flex-shrink:0;}
.t-bar.g{background:var(--green);}
.t-bar.y{background:var(--yellow);}
.t-bar.o{background:var(--orange);}
.t-bar.r{background:var(--red);}
.t-bar.x{background:var(--border);}

/* City column */
.t-city{
  padding:0 16px 0 20px;
  display:flex;flex-direction:column;gap:2px;
}
.t-city-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:18px;font-weight:700;letter-spacing:.04em;
  color:rgba(255,255,255,.9);
}
.t-city-hint{
  font-family:'Share Tech Mono',monospace;
  font-size:9.5px;color:var(--muted);
}

/* Time option cell */
.t-opt{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px 16px;
  gap:7px;
  border-left:1px solid rgba(255,255,255,.05);
  height:100%;
}

/* The big time number */
.t-time{
  font-family:'Share Tech Mono',monospace;
  font-size:34px;font-weight:700;color:#fff;
  line-height:1;white-space:nowrap;
}
.t-time span{
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;font-weight:600;color:rgba(255,255,255,.45);
  margin-left:2px;letter-spacing:.04em;
}
.t-time.na{font-size:20px;color:var(--muted2);font-weight:400;}
.t-time.loading{font-size:14px;color:var(--muted);font-weight:400;}
.t-same{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase;}

/* Traffic pill */
.t-trf{
  display:inline-flex;align-items:center;gap:4px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:12px;white-space:nowrap;
}
.t-trf.g{background:rgba(39,174,96,.1); color:rgba(39,174,96,.9);  border:1px solid rgba(39,174,96,.2);}
.t-trf.y{background:rgba(245,197,24,.1);color:rgba(245,197,24,.9); border:1px solid rgba(245,197,24,.2);}
.t-trf.o{background:rgba(255,107,53,.1);color:rgba(255,107,53,.9); border:1px solid rgba(255,107,53,.2);}
.t-trf.r{background:rgba(228,3,46,.1);  color:rgba(255,120,120,.9);border:1px solid rgba(228,3,46,.2);}

/* Direction toggle */
/* Direction toggle */
/* Direction toggle */
/* Direction toggle */
.dir-toggle{display:flex;gap:3px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px;margin-left:8px;}
.dir-btn{padding:5px 14px;border-radius:4px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);cursor:pointer;border:none;background:transparent;transition:all .2s;}
.dir-btn:hover{color:#fff;background:rgba(255,255,255,.08);}
.dir-btn.active{background:rgba(255,255,255,.15);color:#fff;}
.travel-upd{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);}
.travel-grid{display:grid;grid-template-columns:repeat(4,1fr);}
.travel-route{padding:22px 20px 24px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:14px;}
.travel-route:last-child{border-right:none;}
.travel-from{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);display:flex;align-items:center;gap:7px;}
.travel-from::before{content:'A';display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:rgba(39,174,96,.18);border:1px solid rgba(39,174,96,.35);color:var(--green);font-size:9px;font-weight:700;flex-shrink:0;}
.travel-to{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:.05em;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:7px;}
.travel-to::before{content:'B';display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:rgba(228,3,46,.18);border:1px solid rgba(228,3,46,.35);color:var(--red);font-size:9px;font-weight:700;flex-shrink:0;}
.travel-arrow{text-align:center;color:rgba(255,255,255,.15);font-size:18px;letter-spacing:2px;}
.travel-time-block{display:flex;align-items:flex-end;gap:8px;}
.travel-time{font-family:'Share Tech Mono',monospace;font-size:44px;font-weight:700;color:#fff;line-height:1;}
.travel-time-unit{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase;}
.travel-time.loading{font-size:18px;color:var(--muted);}
.travel-time.err{font-size:14px;color:#ff8080;}
.travel-dist{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted);}
.travel-trf{display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:12px;width:fit-content;margin-top:2px;}
.travel-trf.g{background:rgba(39,174,96,.12);color:var(--green);border:1px solid rgba(39,174,96,.25);}
.travel-trf.y{background:rgba(245,197,24,.1);color:var(--yellow);border:1px solid rgba(245,197,24,.2);}
.travel-trf.o{background:rgba(255,107,53,.12);color:var(--orange);border:1px solid rgba(255,107,53,.25);}
.travel-trf.r{background:rgba(228,3,46,.12);color:#ff8080;border:1px solid rgba(228,3,46,.25);}
/* Direction toggle inside card-h */
.dir-toggle{display:flex;gap:3px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:3px;margin-left:8px;}
.dir-btn{padding:3px 12px;border-radius:3px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4);cursor:pointer;border:none;background:transparent;transition:all .2s;}
.dir-btn:hover{color:#fff;background:rgba(255,255,255,.06);}
.dir-btn.active{background:rgba(255,255,255,.15);color:#fff;}
.travel-upd{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);}

/* Light mode overrides */
[data-theme="light"] .board-msg{color:rgba(0,0,128,.3);}
[data-theme="light"] .hdr{box-shadow:0 4px 20px rgba(228,3,46,.25);}
[data-theme="light"] .section-card,.travel-row,[data-theme="light"] .section-card{box-shadow:0 2px 12px var(--shadow);}
[data-theme="light"] .card-h{background:#F0F2F7;}
[data-theme="light"] .dis-item{box-shadow:0 1px 4px rgba(0,0,0,.06);}
[data-theme="light"] .t-city-name{color:var(--text);}
[data-theme="light"] .t-city-hint{color:var(--muted);}
[data-theme="light"] .travel-dir-dest{color:var(--text);}
[data-theme="light"] .bc-title{color:rgba(255,255,255,.85);}
[data-theme="light"] .bc-head{border-bottom:1px solid rgba(255,255,255,.15);}
[data-theme="light"] .w-day-toggle{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.12);}
[data-theme="light"] .w-day-btn{color:rgba(0,0,0,.4);}
[data-theme="light"] .w-day-btn.active{background:rgba(0,0,0,.1);color:var(--text);}
[data-theme="light"] .w-sub-tabs{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.1);}
[data-theme="light"] .w-sub-btn{color:rgba(0,0,0,.4);}
[data-theme="light"] .w-sub-btn.active{background:rgba(0,0,0,.08);color:var(--text);}
[data-theme="light"] .hdr-tabs{background:rgba(0,0,0,.15);border-color:rgba(255,255,255,.15);}
[data-theme="light"] .tab-btn{color:rgba(255,255,255,.65);}
[data-theme="light"] .tab-btn.active{background:#fff;color:var(--red);}
[data-theme="light"] .travel-col-head{background:#F0F2F7;}
[data-theme="light"] .travel-dir-header{background:rgba(0,0,0,.04);}
[data-theme="light"] .dis-merge-head{background:#F0F2F7;}
[data-theme="light"] .map-footer{background:#F0F2F7;}
[data-theme="light"] .no-dis{color:var(--green);}
[data-theme="light"] .rbtn{border-color:var(--border);color:var(--muted);}
[data-theme="light"] .rbtn:hover{border-color:var(--red);color:var(--red);}
[data-theme="light"] .dir-toggle{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.12);}
[data-theme="light"] .dir-btn{color:rgba(0,0,0,.4);}
[data-theme="light"] .dir-btn.active{background:rgba(0,0,0,.1);color:var(--text);}


/* TomTom A8 Map */
.a8-map-wrap{position:relative;width:100%;height:460px;background:var(--card);}
#a8-map{width:100%;height:100%;}
.a8-map-legend{
  position:absolute;bottom:12px;left:12px;z-index:10;
  background:rgba(13,16,22,.88);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;
  display:flex;flex-direction:column;gap:6px;
  backdrop-filter:blur(8px);
}
.a8-legend-title{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:2px;}
.a8-legend-row{display:flex;align-items:center;gap:8px;}
.a8-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.a8-legend-lbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;color:rgba(255,255,255,.7);}
.a8-overlay{position:absolute;top:12px;right:12px;z-index:10;display:flex;flex-direction:column;gap:6px;}
.a8-btn{background:rgba(13,16,22,.88);border:1px solid var(--border);border-radius:6px;padding:6px 12px;color:rgba(255,255,255,.7);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.a8-btn:hover{border-color:var(--red);color:#fff;}
.a8-btn.active{background:rgba(228,3,46,.15);border-color:var(--red);color:var(--red);}


/* A8 TIMELINE */
.a8-tl-wrap{padding:24px 24px 20px;}
.a8-tl-loading{padding:28px;text-align:center;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);}

/* Direction */
.a8-tl-dir{margin-bottom:36px;}
.a8-tl-dir:last-child{margin-bottom:0;}

.a8-tl-dir-hdr{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.a8-tl-arrow{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;
  font-size:13px;font-weight:700;flex-shrink:0;
}
.a8-tl-arrow.east{background:rgba(39,174,96,.15);color:var(--green);border:1px solid rgba(39,174,96,.3);}
.a8-tl-arrow.west{background:rgba(245,197,24,.1); color:var(--yellow);border:1px solid rgba(245,197,24,.25);}
.a8-tl-dir-name{
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.55);
}
.a8-tl-upd{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted2);margin-left:8px;}

/* Conteneur principal */
.a8-tl-body{
  position:relative;
  display:flex;flex-direction:column;
  gap:0;
}

/* Rangée numéros */
.a8-tl-nums{
  display:flex;align-items:flex-end;
  height:32px;
  position:relative;
  margin-bottom:4px;
}
.a8-exit-num{
  position:absolute;
  transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.a8-exit-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:18px;
  padding:0 4px;
  border-radius:4px;
  font-family:'Share Tech Mono',monospace;
  font-size:10px;font-weight:700;
  background:var(--card);
  border:1px solid var(--border);
  color:rgba(255,255,255,.6);
  white-space:nowrap;
}
.a8-exit-tick-top{width:1px;height:6px;background:var(--border);}

/* La barre de trafic */
.a8-tl-bar{
  height:18px;
  border-radius:6px;
  overflow:visible;
  display:flex;
  position:relative;
  background:var(--border);
}

/* Chaque segment coloré */
.a8-seg{
  height:100%;
  position:relative;
  cursor:pointer;
  transition:filter .12s;
}
.a8-seg:first-child{border-radius:6px 0 0 6px;}
.a8-seg:last-child{border-radius:0 6px 6px 0;}
.a8-seg:hover{filter:brightness(1.3);z-index:2;}

/* Tooltip */
.a8-seg::after{
  content:attr(data-tooltip);
  position:absolute;
  bottom:calc(100% + 10px);
  left:50%;transform:translateX(-50%);
  background:rgba(13,16,22,.96);
  border:1px solid var(--border);
  border-radius:7px;
  padding:7px 12px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:600;letter-spacing:.04em;
  color:#fff;
  white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .12s;
  z-index:100;
  box-shadow:0 4px 20px rgba(0,0,0,.6);
}
.a8-seg:hover::after{opacity:1;}

/* Tick sur la barre */
.a8-bar-tick{
  position:absolute;top:0;bottom:0;
  width:2px;background:rgba(0,0,0,.25);
  z-index:1;pointer-events:none;
}

/* Rangée noms */
.a8-tl-names{
  display:flex;
  height:56px;
  position:relative;
  margin-top:4px;
}
.a8-exit-name{
  position:absolute;
  transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;
}
.a8-exit-tick-bot{width:1px;height:6px;background:var(--border);}
.a8-exit-lbl{
  font-family:'Barlow Condensed',sans-serif;
  font-size:9.5px;font-weight:600;letter-spacing:.04em;
  color:var(--muted);
  white-space:nowrap;
  transform:rotate(-40deg) translateX(2px);
  transform-origin:top left;
  max-width:80px;overflow:hidden;text-overflow:ellipsis;
}

/* Couleurs trafic */
.a8-seg.fluide {background:#1DB954;}
.a8-seg.ralenti{background:#FFD600;}
.a8-seg.dense  {background:#FF6D00;}
.a8-seg.bloque {background:#D50000;}
.a8-seg.inconnu{background:#3A3D4A;}

/* Stat résumé */
.a8-stat-row{
  display:flex;gap:8px;flex-wrap:wrap;
  margin-top:10px;
}
.a8-stat{
  display:inline-flex;align-items:center;gap:5px;
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 10px;border-radius:12px;
}
.a8-stat.fluide {background:rgba(29,185,84,.12); color:#1DB954;}
.a8-stat.ralenti{background:rgba(255,214,0,.10);  color:#FFD600;}
.a8-stat.dense  {background:rgba(255,109,0,.12);  color:#FF6D00;}
.a8-stat.bloque {background:rgba(213,0,0,.12);    color:#ff5252;}
